name: CI

on:
  push:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  go-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-bookworm
        env:
          POSTGRES_USER: managerapp_ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: managerapp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U managerapp_ci -d managerapp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgres://managerapp_ci:ci_password@localhost:5432/managerapp_ci?sslmode=disable"
    steps:
      - uses: actions/checkout@v7
      - name: Apply migrations
        run: |
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE/migrations:/migrations:ro" \
            migrate/migrate:v4.19.1 \
            -path /migrations -database "$DATABASE_URL" up
      - name: Roll back migrations
        run: |
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE/migrations:/migrations:ro" \
            migrate/migrate:v4.19.1 \
            -path /migrations -database "$DATABASE_URL" down 1
